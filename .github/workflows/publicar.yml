name: Publicar
# Cada alteração na branch main vai para o ar sozinha (https://pronutre-erp.web.app).
# Cada proposta de alteração (pull request) ganha um link de teste que dura 7 dias.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Conferir o código do sistema
        run: |
          python3 - <<'PY'
          import re, subprocess, sys
          s = open("public/index.html", encoding="utf-8").read()
          for i, js in enumerate(re.findall(r"<script>(.*?)</script>", s, flags=re.S)):
              open(f"/tmp/s{i}.js", "w", encoding="utf-8").write(js)
              r = subprocess.run(["node", "--check", f"/tmp/s{i}.js"], capture_output=True, text=True)
              if r.returncode: print(r.stderr); sys.exit(1)
          print("código ok")
          PY

  teste:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: conferir
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: write, checks: write }
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID || vars.FIREBASE_PROJECT_ID || 'pronutre-erp' }}
          expires: 7d

  producao:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: conferir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Conferir a chave de serviço (sem mostrar o conteúdo)
        env: { PID: "${{ secrets.FIREBASE_PROJECT_ID || vars.FIREBASE_PROJECT_ID || 'pronutre-erp' }}", SA: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" }
        run: |
          if [ -z "$SA" ]; then echo "::error::Falta o segredo FIREBASE_SERVICE_ACCOUNT (Settings > Secrets and variables > Actions > aba Secrets > Repository secrets)."; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          python3 - "$RUNNER_TEMP/sa.json" <<'PY'
          import json, os, sys
          d = json.loads(open(sys.argv[1], encoding="utf-8-sig").read())
          if d.get("type") != "service_account" or "private_key" not in d: print("::error::O segredo não é uma chave de conta de serviço."); sys.exit(1)
          if d.get("project_id") != os.environ["PID"]: print("::error::A chave é do projeto", d.get("project_id"), "e o FIREBASE_PROJECT_ID é", os.environ["PID"]); sys.exit(1)
          print("chave ok:", d.get("client_email"))
          PY
      - name: Lista de municípios (IBGE) para os campos de cidade
        run: |
          python3 - <<'PY'
          import csv, io, json, urllib.request
          def get(u):
              with urllib.request.urlopen(u, timeout=60) as r: return r.read().decode("utf-8")
          d = {}
          try:
              base = "https://raw.githubusercontent.com/kelvins/municipios-brasileiros/main/csv/"
              uf = {r["codigo_uf"]: r["uf"] for r in csv.DictReader(io.StringIO(get(base + "estados.csv")))}
              for r in csv.DictReader(io.StringIO(get(base + "municipios.csv"))):
                  d.setdefault(uf[r["codigo_uf"]], {})[r["nome"]] = [round(float(r["latitude"]), 4), round(float(r["longitude"]), 4)]
          except Exception as e:
              print("::warning::coordenadas indisponíveis, usando só nomes do IBGE:", e)
              for m in json.loads(get("https://servicodados.ibge.gov.br/api/v1/localidades/municipios?view=nivelado")):
                  d.setdefault(m["UF-sigla"], {})[m["municipio-nome"]] = None
          n = sum(len(v) for v in d.values())
          if n < 5000: raise SystemExit(f"lista de municípios incompleta: {n}")
          json.dump(d, open("public/municipios.json", "w", encoding="utf-8"), ensure_ascii=False, separators=(",", ":"))
          print("municípios:", n)
          PY
      - name: Incluir os instaladores dos aplicativos (Windows e Android)
        env: { GH_TOKEN: "${{ github.token }}" }
        # No plano gratuito (Spark) o Firebase não aceita .exe/.apk soltos: vão compactados em .zip.
        run: |
          mkdir -p public/baixar /tmp/apps
          gh release download aplicativos -R "${{ github.repository }}" -D /tmp/apps --clobber || echo "ainda sem aplicativos gerados"
          if ls /tmp/apps/* >/dev/null 2>&1; then (cd /tmp/apps && for f in *; do zip -j -q "$GITHUB_WORKSPACE/public/baixar/${f%.*}.zip" "$f"; done); fi
          ls -la public/baixar
      - name: Publicar o site
        env: { GOOGLE_APPLICATION_CREDENTIALS: "${{ runner.temp }}/sa.json" }
        run: npx -y firebase-tools@13 deploy --only hosting --project "${{ secrets.FIREBASE_PROJECT_ID || vars.FIREBASE_PROJECT_ID || 'pronutre-erp' }}" --non-interactive
      - name: Publicar as regras do banco
        env: { GOOGLE_APPLICATION_CREDENTIALS: "${{ runner.temp }}/sa.json" }
        run: |
          if npx -y firebase-tools@13 deploy --only firestore:rules --project "${{ secrets.FIREBASE_PROJECT_ID || vars.FIREBASE_PROJECT_ID || 'pronutre-erp' }}" --non-interactive; then echo "regras publicadas"
          else echo "::warning::As regras do banco não foram publicadas (a conta de serviço precisa da função Firebase Admin ou cole firestore.rules no console: Firestore > Regras)."; fi
